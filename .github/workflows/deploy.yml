
name: Deploy Frontends to Hostinger

on:
  push:
    branches:
      - master
    paths:
      - "EMSF/**"
      - "CMSF/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-frontend-deploy
  cancel-in-progress: true

jobs:
  deploy-emsf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: EMSF/package-lock.json

      - name: Install EMSF dependencies
        working-directory: EMSF
        run: npm ci

      - name: Build EMSF
        working-directory: EMSF
        run: npm run build

      - name: Verify EMSF build
        working-directory: EMSF
        run: test -f dist/index.html

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify EMSF destination
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          ssh -i ~/.ssh/hostinger_key -p "$HOSTINGER_PORT" \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            'test -d /home/u407424049/domains/eniacinc.com/public_html/ems'

      - name: Deploy EMSF
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          rsync -rlvz --delete --exclude='/.htaccess' \
            -e "ssh -i ~/.ssh/hostinger_key -p $HOSTINGER_PORT" \
            EMSF/dist/ \
            "$HOSTINGER_USER@$HOSTINGER_HOST:/home/u407424049/domains/eniacinc.com/public_html/ems/"

  deploy-cmsf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CMSF/package-lock.json

      - name: Install CMSF dependencies
        working-directory: CMSF
        run: npm ci

      - name: Build CMSF
        working-directory: CMSF
        run: npm run build

      - name: Verify CMSF build
        working-directory: CMSF
        run: test -f dist/index.html

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify CMSF destination
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          ssh -i ~/.ssh/hostinger_key -p "$HOSTINGER_PORT" \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            'test -d /home/u407424049/domains/eniacinc.com/public_html/cms'

      - name: Deploy CMSF
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          rsync -rlvz --delete --exclude='/.htaccess' \
            -e "ssh -i ~/.ssh/hostinger_key -p $HOSTINGER_PORT" \
            CMSF/dist/ \
            "$HOSTINGER_USER@$HOSTINGER_HOST:/home/u407424049/domains/eniacinc.com/public_html/cms/"
