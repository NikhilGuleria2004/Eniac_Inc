version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: eniac-ems-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: eniac-ems-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      MONGODB_URI: mongodb://root:example@mongodb:27017/?authSource=admin
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mongodb_data:
